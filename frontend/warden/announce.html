<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Student Dashboard</title>
        <link rel="stylesheet" href="css/announce.css">
    </head>
    <body>
        <div id="slidebar-container"></div>
        <div class="main-content">
            <h1>Welcome Warden</h1>
            <p id="current-date"></p>

            <div class="top">
                <button onclick="showAnnouncementForm()" class="add-new-btn" id="add-btn">+ New announcement</button>
            </div>

            <div class="section" id="add-announce">
                <div class="form-header">
                    <h3>Create Announcement</h3>
                    <button class="close-btn" onclick="closeAnnouncementForm()">✖</button>
                </div>

                <div class="form-row">
                <div class="add-item">
                    <label for="title">Announcement title</label>
                    <input id="title" type="text" placeholder="What do students need to know?">
                </div>

                <div class="add-item">
                    <label for="desc">Description</label>
                    <textarea id="desc" placeholder="Write a clear, helpful announcement..."></textarea>
                </div></div>

                <div class="form-row">
                <div class="add-item">
                    <label>Category</label>
                    <select id="category-item">
                        <option value="">General</option>
                        <option value="mess">Mess</option>
                        <option value="payment">Payment</option>
                        <option value="maintenance">Maintenance</option>
                        <option value="emergency">Emergency</option>
                        <option value="event">Events</option>
                    </select>
                </div>

                <div class="add-item">
                    <label>Priority</label>
                    <select id="priority-item">
                        <option value="">Select</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="add-item">
                    <label>Audience</label>
                    <select id="audience-item">
                        <option value="">Select Audience</option>
                        <option value="boys">Girls Hostel</option>
                        <option value="girls">Boys Hostel</option>
                        <option value="specific">Selected Room</option>
                    </select>
                </div></div>

                <div class="add-item">
                    <label>Publish Options :</label>
                    <form>
                        <input type="radio" id="publish" name="publish_option" value="publish">
                        <label for="publish">Publish</label><br>
                        <input type="radio" id="pin" name="publish_option" value="pin">
                        <label for="pin">Pin announcement</label><br>
                        <input type="radio" id="notify" name="publish_option" value="notify">
                        <label for="notify">Notify Students</label>
                    </form>
                </div>

                <div class="submit-item">
                    <button class="draft">Save Draft</button>
                    <button class="public">Publish</button>
                    <button class="reset">Reset</button>
                </div>
            </div>

            <!-- MAIN PAGE CONTENT -->

            <div class="menu-summary">
                <div class="sum-item">
                    <h4 id="total-announce"></h4>
                    <span>Total announcements</span>
                </div>
                <div class="sum-item">
                    <h4 id="publish-announce"></h4>
                    <span>Published</span>
                </div>
                <div class="sum-item">
                    <h4 id="total-schedule"></h4>
                    <span>Scheduled</span>
                </div>
                <div class="sum-item">
                    <h4 id="total-drafts"></h4>
                    <span>Drafts</span>
                </div>
                <div class="sum-item">
                    <h4 id="total-high"></h4>
                    <span>High priority</span>
                </div>
            </div>

            <!-- SEARCH BAR -->
             <div class="search">
                <div class="search-item">
                    <input type="text" placeholder="Search anoouncements...">
                </div>
                <div class="search-item">
                    <select class="by-category">
                        <option value="">All Categories</option>
                        <option value="mess">Mess</option>
                        <option value="payment">Payment</option>
                        <option value="maintenance">Maintenance</option>
                        <option value="emergency">Emergency</option>
                        <option value="event">Events</option>
                    </select>
                </div>
                <div class="search-item">
                    <select id="by-priority">
                        <option value="">All priorities</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="search-item">
                    <select id="by-status">
                        <option value="">All statuses</option>
                        <option value="pub">Publish</option>
                        <option value="sch">Scheduled</option>
                    </select>
                </div>
                <div class="search-item">
                    <button class="clear-filter">✖ Clear</button>
                </div>
            </div>

            <!-- ANNOUNCEMENT FEED -->
        </div>
    </body>
    <script src="js/announce.js"></script>
</html>
