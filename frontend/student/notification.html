<!DOCTYPE html>
<html>
    <head>
        <title>Notifications</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/notify.css">
    </head>
    <body>
        <!-- Include the slidebar -->
        <div class="container">
            <div id="slidebar-container"></div>
            <div class="main-content">
                <h1>Notifications</h1>
                <p>Stay updated with latest announcements from Admin and Warden</p>
                <div class="notification-class" id="notification-list">
                    <div class="notify-item">
                        <h3>WiFi Maintenance</h3>
                        <p>The WiFi network will be down for maintenance on Saturday, April 24th from 2:00 PM to 4:00 PM. We apologize for any inconvenience this may cause.</p>
                        <div class="item-footer">
                            <span class="date">2026-04-21</span>
                            <span class="time">10:27 AM</span>
                            <span class="author">Admin</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="js/notification.js"></script>
</html>
