<!DOCTYPE html>
<html>
    <head>
        <title>Notifications</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/notify.css">
    </head>
    <body>
        <!-- Include the slidebar -->
        <div class="container">
            <div id="slidebar-container"></div>

            <div class="main-content">
                <h1>Notifications</h1>
                <p id="current-date"></p>
                
                <!-- SUMMARY CARD -->
                <div class="menu-summary">
                <div class="sum-item">
                    <h4 id="total-announce"></h4>
                    <span>Total notifications</span>
                </div>
                <div class="sum-item">
                    <h4 id="total-unread"></h4>
                    <span>Unread Notifications</span>
                </div>
                <div class="sum-item">
                    <h4 id="total-pinned"></h4>
                    <span>Pinned Notifications</span>
                </div>
                <div class="sum-item">
                    <h4 id="total-high"></h4>
                    <span>High priority</span>
                </div>
                </div>

                <h3>All Notifications (3)</h3>

                <!-- SEARCH BAR -->
                <div class="search">
                <div class="search-item">
                    <input type="text" placeholder="Search announcements...">
                </div>
                <div class="search-item">
                    <select class="by-category">
                        <option value="">All Categories</option>
                        <option value="mess">Mess</option>
                        <option value="payment">Payment</option>
                        <option value="maintenance">Maintenance</option>
                        <option value="emergency">Emergency</option>
                        <option value="event">Events</option>
                    </select>
                </div>
                <div class="search-item">
                    <select id="by-priority">
                        <option value="">All priorities</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="search-item">
                    <button class="clear-filter">✖ Clear</button>
                </div>
            </div>

            <!-- NOTIFICATION FEED -->
            <div id="notification-list">

                <!-- JS yahan notification cards add karega -->

            </div>
            </div>
        </div>
    </body>
    <script src="js/notification.js"></script>
</html>
